[package]
name = "gandr"
version = "0.1.0"
edition = "2021"
description = "A read-only TUI to review code changes and browse your repo — delta-style diffs, GitHub-like side-by-side, built for reviewing AI coding-agent changes."
authors = ["Giovanni Borgogno <giovaborgogno@gmail.com>"]
license = "MIT"
readme = "README.md"
# TODO(pre-publish): confirm this matches your actual GitHub repo before `cargo publish`.
repository = "https://github.com/giovaborgogno/gandr"
homepage = "https://github.com/giovaborgogno/gandr"
keywords = ["git", "diff", "tui", "review", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate lean: ship the source, drop agent/dev-only material.
exclude = [".claude/", "docs/", "*.html", "AGENTS.md", "CLAUDE.md", "PLAN.md", "DESIGN.md"]
publish = true

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Git backend (always behind the GitBackend trait; swappable for gix later)
git2 = "0.21"

# Diff engine: line-level + word-level (the engine helix/gitoxide use)
imara-diff = "0.2"

# Syntax highlighting (delta-style), with embedded syntaxes/themes
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }

# Terminal background detection for theme = "auto" (OSC 11)
termbg = "0.6"

# File watching for live auto-refresh of the working tree
notify = "8"
notify-debouncer-mini = "0.7"

# Async diff computation without blocking the render loop
crossbeam-channel = "0.5"

# Errors
anyhow = "1"

# Review-state persistence (.git/gandr/state.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Repo-wide search: `ignore` walks the tree respecting .gitignore (fd-style file
# search); `grep` is ripgrep's engine for content search. No external binaries.
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"

# Temp git repos for the `testutil` fixture helper (used by tests + examples,
# never by the binary's real code path).
tempfile = "3"

[dev-dependencies]
# Snapshot testing of rendered TUI frames (see docs/testing.md)
insta = "1"

[profile.release]
opt-level = 3
lto = "thin"

# Faster snapshot/test iteration without sacrificing too much runtime speed.
[profile.dev]
opt-level = 1
